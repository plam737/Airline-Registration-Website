# fly.toml app configuration file generated for peters-aviation-database on 2026-11-14T03:46:42-08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'peters-aviation-database'
primary_region = 'lax'

[build]
[mounts]
  source = "aviation_data"
  destination = "/data"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 1114
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  NODE_ENV = "production"