<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Database - Peter's Aviation Database</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <h1>Registration Database</h1>

  <div class="filters">
    <label>
      Country:
      <select id="country-filter">
        <option value="">All Countries</option>
      </select>
    </label>
    <label>
      Airline:
      <select id="airline-filter">
        <option value="">All Airlines</option>
      </select>
    </label>
  </div>

  <table id="registrations-table">
    <thead>
      <tr>
        <th>Registration</th>
        <th>Airline</th>
        <th>Country</th>
        <th>Aircraft</th>
        <th>Times Spotted</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="registrations-body">
      <!-- Rows get added here by database.js -->
    </tbody>
  </table>

   <script src="nav.js"></script>
  <script src="database.js"></script>
</body>
</html>
