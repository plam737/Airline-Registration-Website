<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Peter's Aviation Database</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <h1>Welcome to Peter's Aviation Database</h1>
  <p id="last-session">Loading...</p>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-number" id="stat-registrations">-</span>
      <span class="stat-label">Registrations</span>
    </div>
    <div class="stat-card">
      <span class="stat-number" id="stat-airlines">-</span>
      <span class="stat-label">Airlines</span>
    </div>
    <div class="stat-card">
      <span class="stat-number" id="stat-sessions">-</span>
      <span class="stat-label">Sessions</span>
    </div>
    <div class="stat-card">
      <span class="stat-number" id="stat-airports">-</span>
      <span class="stat-label">Airports</span>
    </div>
  </div>

  <div class="charts-grid">
    <div class="chart-container">
      <canvas id="top-airlines-chart"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="top-countries-chart"></canvas>
    </div>
  </div>

  <script src="nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
